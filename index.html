<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>畫出台灣</title>
<!-- Bump ?v=N on style.css/shared.js/shared-outline.js/draw-data.js/
     records.js/game.js whenever any of them change -- GitHub Pages' CDN +
     browsers cache these aggressively enough that without a cache-busting
     query string, a deploy can take a long time (or a manual hard-refresh)
     to actually reach a returning visitor, even though the new file is
     live on the server. -->
<link rel="stylesheet" href="style.css?v=22">
</head>
<body>
  <header>
    <h1>畫出台灣</h1>
    <p class="subtitle tagline">憑記憶畫出台灣本島的輪廓，看看你能拿到幾分</p>
    <div id="mode-toggle">
      <button id="mode-normal-btn" class="mode-btn" type="button">一般模式</button>
      <button id="mode-challenge-btn" class="mode-btn" type="button">🗓️ 每日挑戰</button>
    </div>
    <p id="challenge-desc" class="subtitle" hidden></p>
    <div id="challenge-tools" hidden>
      <button id="catchup-btn" type="button">📅 補玩錯過的挑戰</button>
      <button id="back-to-today-btn" type="button" hidden>↩️ 返回今天</button>
    </div>
    <div id="catchup-panel" hidden>
      <p class="catchup-panel-title">選擇想補玩的日期：</p>
      <div id="catchup-list"></div>
      <button id="catchup-close-btn" type="button">關閉</button>
    </div>
    <p id="best-score-line" class="subtitle">🏆 最高紀錄：尚未挑戰</p>
    <p class="cross-link"><a href="placename/">📍 也來玩每日台灣地名挑戰 →</a></p>
  </header>

  <main>
    <div id="hint-bar">
      <span id="start-hint" class="hint">📍 起點：最北端(富貴角)</span>
      <span class="hint">📏 比例尺已標示在畫布左下角</span>
      <label id="south-toggle-label" class="hint toggle-hint">
        <input type="checkbox" id="south-marker-toggle" checked>
        顯示最南端(鵝鑾鼻)
      </label>
    </div>

    <div id="canvas-wrap">
      <canvas id="bg-canvas"></canvas>
      <canvas id="draw-canvas"></canvas>
      <canvas id="result-canvas"></canvas>
      <div id="rotate-hint" hidden>📱 今天的地圖偏橫向，建議把手機轉成橫向遊玩，畫布會大很多！</div>
    </div>

    <div id="controls">
      <button id="undo-btn" type="button">復原</button>
      <button id="clear-btn" type="button">清除重畫</button>
      <button id="finish-btn" type="button">完成</button>
      <button id="download-card-btn" type="button" hidden>下載成績卡片</button>
      <button id="retry-btn" type="button" hidden>再玩一次</button>
    </div>

    <div id="result-panel" hidden>
      <p class="scroll-hint">👆 上滑看地圖比對・👇 這裡是完整成績，可以上下滑動查看</p>
      <div id="new-record-badge" hidden>🎉 新紀錄！</div>
      <div id="score-grade"></div>
      <div id="score-number"></div>
      <p id="score-message"></p>

      <div id="score-breakdown">
        <div class="score-item">
          <span class="score-item-label">形狀相似度</span>
          <div class="score-bar"><div class="score-bar-fill" id="shape-bar"></div></div>
          <span class="score-item-value" id="shape-score-value">0%</span>
        </div>
        <div class="score-item">
          <span class="score-item-label">比例大小</span>
          <div class="score-bar"><div class="score-bar-fill" id="size-bar"></div></div>
          <span class="score-item-value" id="size-score-value">0%</span>
        </div>
        <div class="score-item">
          <span class="score-item-label">位置偏移</span>
          <div class="score-bar"><div class="score-bar-fill" id="position-bar"></div></div>
          <span class="score-item-value" id="position-score-value">0%</span>
        </div>
      </div>

      <div class="legend">
        <span><i class="swatch swatch-correct"></i>畫對的地方</span>
        <span><i class="swatch swatch-over"></i>你多畫的地方</span>
        <span><i class="swatch swatch-under"></i>你少畫的地方</span>
      </div>

      <div id="score-analysis"></div>
    </div>
  </main>

  <script src="shared-outline.js?v=22"></script>
  <script src="shared.js?v=23"></script>
  <script src="draw-data.js?v=22"></script>
  <script src="records.js?v=23"></script>
  <script src="game.js?v=24"></script>
</body>
</html>

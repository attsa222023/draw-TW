<!-- Favicon for both pages (root and /placename/): a simplified version of
     the same TAIWAN_OUTLINE data/projection the game itself draws with, at
     roughly 1/5th the point count (still enough to read as Taiwan at
     favicon size). Colored to match the in-game map: same island fill and
     stroke as drawBackground()'s "#3a92c9" fill plus "#eaf6ff" stroke in
     both game.js files, on the same ocean-deep background color. Rebuild
     the path (downsample every 5th TAIWAN_OUTLINE point, project with
     x = lon * cos(avg lat), y = -lat, then normalize into the viewBox) if
     the outline data ever changes. -->
